name: JADOO integration verification
on:
  push:
    branches: [main]
    paths: ['appwrite/jadoo-speech/**','nepali-voice-bridge.js','sikau-runtime.js','.github/workflows/jadoo-voice-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test appwrite/jadoo-speech/main.test.js
      - run: node --check sikau-runtime.js && node --check nepali-voice-bridge.js
