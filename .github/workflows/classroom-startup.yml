name: Classroom startup no-flash checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'coach-v4-live.html'
      - 'test/browser-translation-optout.test.mjs'
      - 'test/lesson-startup-no-flash.test.mjs'
      - '.github/workflows/classroom-startup.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'coach-v4-live.html'
      - 'test/browser-translation-optout.test.mjs'
      - 'test/lesson-startup-no-flash.test.mjs'
      - '.github/workflows/classroom-startup.yml'
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lesson load barrier with simulated fast, slow and failed CSS
        run: node --test test/lesson-startup-no-flash.test.mjs test/browser-translation-optout.test.mjs
