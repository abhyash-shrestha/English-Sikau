name: Publish verified V2 preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v2-preview.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: v2-preview-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download the successful V2 build
        uses: actions/download-artifact@v4
        with:
          name: english-sikau-v2-preview
          run-id: 45473488743
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: v2-preview
      - name: Validate and commit only compiled preview
        run: |
          test -f v2-preview/index.html
          test -f v2-preview/assets/index-BY6YoVj4.js
          test -f v2-preview/assets/index-ME_W3pgN.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- v2-preview/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified TypeScript V2 preview assets'
          git push origin HEAD:main
