name: Modern rebuild checks
on:
  push:
    branches: [modern-typescript-rebuild]
  pull_request:
    branches: [main]
    paths: ['modern/**', 'package.json', 'tsconfig.json', 'legacy-runtime.js', 'legacy-shell.css', 'index.html']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node --check legacy-runtime.js && node --check mobile-bar-handles.js
      - uses: actions/upload-artifact@v4
        with:
          name: modern-launcher
          path: modern-dist/
