name: Existing site TypeScript verification
on:
  push:
    branches: [main]
    paths: ['src/**','header-language.js','mobile-bar-handles.js','tests/production-header-language.mjs','tsconfig.production.json','.github/workflows/production-typescript.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm exec --yes --package=typescript@5.9.3 -- tsc --project tsconfig.production.json
      - run: node --check build-typescript/mobile-bar-handles.js
      - run: node --check mobile-bar-handles.js
      - run: node tests/production-header-language.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-typescript-runtime
          path: build-typescript/mobile-bar-handles.js
